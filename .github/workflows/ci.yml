name: ANEB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aneb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build Android probe
        working-directory: app
        run: >-
          ./gradlew
          :probe:testDebugUnitTest
          :probe:lintDebug
          :probe:assembleDebug
          --no-daemon
          --no-parallel
          --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          -Pksp.incremental=false

  server:
    name: Go server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test ANEB node
        working-directory: server
        run: go test -count=1 ./...

  gateway:
    name: Dedicated gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache: false
      - name: Install namespace test dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping curl python3
      - name: Test gateway control plane
        working-directory: gateway
        run: go test -count=1 -race ./...
      - name: Build and test isolated network namespace
        working-directory: gateway
        run: |
          CGO_ENABLED=0 go build -o aneb-gateway-linux ./cmd/aneb-gateway
          sudo ANEB_GATEWAY_BINARY="$PWD/aneb-gateway-linux" ./scripts/namespace_integration_test.sh

  behavior-model:
    name: AI behavior model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model test dependencies
        working-directory: tools/aneb-ai-behavior-model
        run: python -m pip install -e ".[test]"
      - name: Test deterministic model
        working-directory: tools/aneb-ai-behavior-model
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
