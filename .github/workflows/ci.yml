name: ANEB CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aneb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Tracked-source credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject high-confidence credentials
        run: python scripts/scan_repository_secrets.py

  android:
    name: Android candidate build
    needs: [security, contracts, collector-windows, server, gateway, behavior-model]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android identity tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Install evidence verifier dependencies
        run: python -m pip install "jsonschema>=4.22,<5"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build Android probe
        working-directory: app
        run: >-
          ./gradlew
          :probe:testDebugUnitTest
          :probe:lintDebug
          :probe:processReleaseMainManifest
          :probe:assembleDebug
          --no-daemon
          --no-parallel
          --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          -Pksp.incremental=false
      - name: Revalidate D-82 bundle against the real APK
        run: |
          python -c "from scripts.tests.test_verify_token_quick_evidence_bundle import APK_INTEGRATION_AVAILABLE; raise SystemExit(0 if APK_INTEGRATION_AVAILABLE else 'D-82 real APK integration prerequisites unavailable')"
          python -m unittest scripts.tests.test_verify_token_quick_evidence_bundle.TokenQuickEvidenceBundleVerifierTests -v
      - name: Verify Debug and Release component boundary
        shell: pwsh
        run: ./scripts/verify_release_boundary.ps1
      - name: Package auditable Debug candidate
        run: >-
          python scripts/package_debug_candidate.py
          --apk app/probe/build/outputs/apk/debug/probe-debug.apk
          --metadata app/probe/build/outputs/apk/debug/output-metadata.json
          --output dist/aneb-probe-debug
          --source-sha "${{ github.sha }}"
          --source-ref "${{ github.ref }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --build-tools-version "35.0.0"
      - name: Attest exact Debug candidate payload provenance
        if: github.event_name != 'pull_request'
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: dist/aneb-probe-debug/checksums.sha256
      - name: Finalize attested Debug candidate
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/package_debug_candidate.py
          --output dist/aneb-probe-debug
          --finalize-bundle "${{ steps.attest.outputs.bundle-path }}"
      - name: Reverify exact Debug candidate provenance
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GH_PATH="$(command -v gh)"
          if [[ "$GH_PATH" != "/usr/bin/gh" || ! -x "$GH_PATH" || -L "$GH_PATH" ]]; then
            echo "::error::Trusted runner gh executable is unavailable: $GH_PATH"
            exit 1
          fi
          python scripts/verify_ci_apk_provenance.py \
            dist/aneb-probe-debug \
            --source-commit "${{ github.sha }}" \
            --gh-path "$GH_PATH"
      - name: Upload verified Debug candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aneb-probe-debug-verified-${{ github.sha }}
          path: dist/aneb-probe-debug/
          if-no-files-found: error
          retention-days: 30
      - name: Upload review-unattested Debug candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aneb-probe-debug-review-unattested-${{ github.event.pull_request.head.sha }}
          path: dist/aneb-probe-debug/
          if-no-files-found: error
          retention-days: 14

  contracts:
    name: Profile, result, and packaging contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Install contract validator dependencies
        run: python -m pip install -e "tools/aneb-ai-behavior-model[test]"
      - name: Verify catalog and result schemas
        run: |
          python scripts/verify_spec_catalog.py
          python scripts/verify_result_schema.py
      - name: Test analysis and candidate packaging tools
        run: python -m unittest discover -s scripts/tests -v

  collector-windows:
    name: Windows evidence collector contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Windows-only evidence security and publication
        run: >-
          python -m unittest -v
          scripts.tests.test_collect_token_quick_evidence.TokenQuickEvidenceCollectorTests.test_private_evidence_root_requires_current_owner_and_write_allowlist
          scripts.tests.test_collect_token_quick_evidence.TokenQuickEvidenceCollectorTests.test_bounded_native_process_kills_hung_child_with_machine_reason
          scripts.tests.test_collect_token_quick_evidence.TokenQuickEvidenceCollectorTests.test_collector_empty_verified_boot_is_observed_but_not_claimed_secure
          scripts.tests.test_collect_token_quick_evidence.TokenQuickEvidenceCollectorTests.test_evidence_root_chain_rejects_an_ancestor_junction_before_writes
          scripts.tests.test_collect_token_quick_evidence.TokenQuickEvidenceCollectorTests.test_ready_marker_is_digest_bound_and_is_the_last_release_commit

  server:
    name: Go server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test ANEB node
        working-directory: server
        run: go test -count=1 ./...

  gateway:
    name: Dedicated gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANEB_GATEWAY_TEST_CERT_PEM: ${{ secrets.ANEB_GATEWAY_TEST_CERT_PEM }}
      ANEB_GATEWAY_TEST_KEY_PEM: ${{ secrets.ANEB_GATEWAY_TEST_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache: false
      - name: Install namespace test dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping curl python3
      - name: Test gateway control plane
        working-directory: gateway
        run: go test -count=1 -race ./...
      - name: Build dedicated gateway binary
        working-directory: gateway
        run: CGO_ENABLED=0 go build -o aneb-gateway-linux ./cmd/aneb-gateway
      - name: Record external namespace-test boundary
        if: env.ANEB_GATEWAY_TEST_CERT_PEM == '' || env.ANEB_GATEWAY_TEST_KEY_PEM == ''
        run: |
          echo "::notice::CA-signed gateway leaf is not configured; external TLS/netem namespace test was not executed."
          echo "### Dedicated gateway external boundary" >> "$GITHUB_STEP_SUMMARY"
          echo "Control-plane tests and the Linux binary build passed. The isolated TLS/netem namespace test requires the repository secrets \`ANEB_GATEWAY_TEST_CERT_PEM\` and \`ANEB_GATEWAY_TEST_KEY_PEM\`; it was **not executed** for this run." >> "$GITHUB_STEP_SUMMARY"
      - name: Test isolated TLS and netem network namespace
        if: env.ANEB_GATEWAY_TEST_CERT_PEM != '' && env.ANEB_GATEWAY_TEST_KEY_PEM != ''
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          TLS_DIR="$(mktemp -d)"
          trap 'rm -rf "$TLS_DIR"' EXIT
          printf '%s' "$ANEB_GATEWAY_TEST_CERT_PEM" > "$TLS_DIR/leaf.pem"
          printf '%s' "$ANEB_GATEWAY_TEST_KEY_PEM" > "$TLS_DIR/leaf-key.pem"
          chmod 0600 "$TLS_DIR/leaf.pem" "$TLS_DIR/leaf-key.pem"
          sudo \
            ANEB_GATEWAY_BINARY="$PWD/aneb-gateway-linux" \
            ANEB_GATEWAY_TEST_CERT="$TLS_DIR/leaf.pem" \
            ANEB_GATEWAY_TEST_KEY="$TLS_DIR/leaf-key.pem" \
            ./scripts/namespace_integration_test.sh

  behavior-model:
    name: AI behavior model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model test dependencies
        working-directory: tools/aneb-ai-behavior-model
        run: python -m pip install -e ".[test]"
      - name: Test deterministic model
        working-directory: tools/aneb-ai-behavior-model
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
