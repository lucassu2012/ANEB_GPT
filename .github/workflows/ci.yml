name: ANEB CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aneb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  android:
    name: Verified Android candidate
    needs: [contracts, server, gateway, behavior-model]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build Android probe
        working-directory: app
        run: >-
          ./gradlew
          :probe:testDebugUnitTest
          :probe:lintDebug
          :probe:assembleDebug
          --no-daemon
          --no-parallel
          --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          -Pksp.incremental=false
      - name: Verify Debug and Release component boundary
        shell: pwsh
        run: ./scripts/verify_release_boundary.ps1
      - name: Package auditable Debug candidate
        run: >-
          python scripts/package_debug_candidate.py
          --apk app/probe/build/outputs/apk/debug/probe-debug.apk
          --metadata app/probe/build/outputs/apk/debug/output-metadata.json
          --output dist/aneb-probe-debug
          --source-sha "${{ github.sha }}"
          --source-ref "${{ github.ref }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Attest exact Debug APK provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: dist/aneb-probe-debug/*.apk
      - name: Upload verified Debug candidate
        uses: actions/upload-artifact@v4
        with:
          name: aneb-probe-debug-${{ github.sha }}
          path: dist/aneb-probe-debug/
          if-no-files-found: error
          retention-days: 30

  contracts:
    name: Profile, result, and packaging contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify catalog and result schemas
        run: |
          python scripts/verify_spec_catalog.py
          python scripts/verify_result_schema.py
      - name: Test analysis and candidate packaging tools
        run: python -m unittest discover -s scripts/tests -v

  server:
    name: Go server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test ANEB node
        working-directory: server
        run: go test -count=1 ./...

  gateway:
    name: Dedicated gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache: false
      - name: Install namespace test dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping curl python3
      - name: Test gateway control plane
        working-directory: gateway
        run: go test -count=1 -race ./...
      - name: Build and test isolated network namespace
        working-directory: gateway
        run: |
          CGO_ENABLED=0 go build -o aneb-gateway-linux ./cmd/aneb-gateway
          sudo ANEB_GATEWAY_BINARY="$PWD/aneb-gateway-linux" ./scripts/namespace_integration_test.sh

  behavior-model:
    name: AI behavior model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model test dependencies
        working-directory: tools/aneb-ai-behavior-model
        run: python -m pip install -e ".[test]"
      - name: Test deterministic model
        working-directory: tools/aneb-ai-behavior-model
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
