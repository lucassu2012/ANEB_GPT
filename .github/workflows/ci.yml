name: ANEB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aneb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build Android probe
        working-directory: app
        run: >-
          ./gradlew
          :probe:testDebugUnitTest
          :probe:lintDebug
          :probe:assembleDebug
          --no-daemon
          --no-parallel
          --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          -Pksp.incremental=false

  server:
    name: Go server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test ANEB node
        working-directory: server
        run: go test -count=1 ./...

  behavior-model:
    name: AI behavior model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deterministic model
        working-directory: tools/aneb-ai-behavior-model
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
