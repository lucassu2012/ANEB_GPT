server {
    listen 80;

    # 实测（run1/run2，见标定报告）：纯 proxy_buffering on 在"上游逐 event flush +
    # 本机快速客户端"下并不攒批——buffering 只解耦上游读与客户端写，客户端不慢就
    # 逐 chunk 转发，签名与 clean 无差别。真实中间盒的"攒-放"需要输出侧累积环节：
    # 用 gzip 过滤器复现（真实网络常见配置；gzip 不对每个 chunk 做 Z_SYNC_FLUSH，
    # 压缩窗口攒满才吐块——正是现网 SSE 被中间盒攒批的高频成因之一）。
    gzip on;
    gzip_types text/event-stream;
    gzip_min_length 0;
    # 默认 gzip_buffers 32 4k（128KB）＞ 600 token 流的压缩总量（~100KB），
    # 会把整条流扣到 EOF 一次放出（实测 probe：全流两大批）。收窄到 16KB 让
    # 中间盒呈现周期性"攒-放"（~每 16KB 压缩输出放一批），更贴近现网缓冲中间盒。
    gzip_buffers 4 4k;

    location / {
        proxy_pass http://host.docker.internal:8443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # proxy_buffering 保持默认 on —— 这正是 P1-C08 要采集的中间盒缓冲签名来源。
        # aneb-server 响应带 X-Accel-Buffering: no（其本意是防生产路径被反代缓冲），
        # nginx 默认会尊重该头逐响应关缓冲——标定实验要的就是"带缓冲的中间盒"，
        # 故显式忽略之（模拟不认识/不理会该头的真实中间盒）。
        proxy_ignore_headers X-Accel-Buffering;
    }
}
