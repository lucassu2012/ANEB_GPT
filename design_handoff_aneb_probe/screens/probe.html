<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b1b">
  <meta name="color-scheme" content="dark">
  <title>ANEB Probe · API 探针</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="future.css">
</head>
<body>
  <main class="preview-stage">
    <section class="device-shell" aria-label="ANEB API 探针手机界面">
      <div id="future-app" class="app future-app probe-app">
        <div class="future-noise" aria-hidden="true"></div>
        <div class="status-bar" aria-label="状态栏">
          <span>14:32</span>
          <span class="status-icons"><span class="signal" aria-label="信号良好"><i></i><i></i><i></i><i></i></span><span class="wifi" aria-hidden="true"></span><span class="battery" aria-label="电量 86%"><i></i></span></span>
        </div>
        <a class="wordmark" href="home.html" aria-label="返回 ANEB Probe 首页">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 13.5a7 7 0 0 1 13 0" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><path d="m10 13 3.7-5" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><circle cx="10" cy="13" r="1" fill="currentColor"/></svg><strong>ANEB</strong><span>PROBE</span>
        </a>
        <button class="menu-button" type="button" data-future-toast="更多探针设置将在接入真实服务后开放" aria-label="更多设置"><i></i><i></i><i></i></button>

        <header class="screen-heading">
          <div><span>ENDPOINT MONITOR</span><h1>API 探针</h1></div>
          <span class="live-badge"><i></i>实时</span>
        </header>

        <section class="probe-summary" aria-label="API 探针概览">
          <button id="probe-start" class="probe-ring" type="button" aria-label="开始 API 探针测试">
            <span class="probe-track"></span><span class="probe-progress"></span>
            <span class="probe-copy"><strong id="probe-score">GO</strong><small id="probe-status">开始探测</small></span>
          </button>
          <div class="probe-kpis">
            <div><strong id="available-count">3/4</strong><span>可用</span></div>
            <div><strong id="average-latency">118<small>ms</small></strong><span>平均延迟</span></div>
            <div><strong id="incident-count">1</strong><span>异常</span></div>
          </div>
        </section>

        <section class="endpoint-section" aria-label="API 节点状态">
          <div class="section-label"><span>服务状态</span><button type="button" data-future-toast="筛选功能将在真实数据接入后开放">全部节点⌄</button></div>
          <div class="endpoint-list">
            <article class="endpoint-card good" data-endpoint>
              <span class="endpoint-icon">O</span>
              <div class="endpoint-name"><strong>OpenAI API</strong><span>api.openai.com</span></div>
              <svg viewBox="0 0 72 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 16L8 15L16 17L24 9L32 13L40 8L48 11L56 7L64 9L72 6"/></svg>
              <div class="endpoint-state"><strong>86 ms</strong><span>正常</span></div>
            </article>
            <article class="endpoint-card warning" data-endpoint>
              <span class="endpoint-icon">A</span>
              <div class="endpoint-name"><strong>Anthropic API</strong><span>api.anthropic.com</span></div>
              <svg viewBox="0 0 72 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 17L8 15L16 19L24 8L32 16L40 5L48 14L56 8L64 18L72 10"/></svg>
              <div class="endpoint-state"><strong>142 ms</strong><span>波动</span></div>
            </article>
            <article class="endpoint-card bad" data-endpoint>
              <span class="endpoint-icon">G</span>
              <div class="endpoint-name"><strong>Gemini API</strong><span>generativelanguage</span></div>
              <svg viewBox="0 0 72 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 19L8 17L16 18L24 6L32 20L40 4L48 19L56 7L64 21L72 20"/></svg>
              <div class="endpoint-state"><strong>—</strong><span>超时</span></div>
            </article>
            <article class="endpoint-card good" data-endpoint>
              <span class="endpoint-icon">GH</span>
              <div class="endpoint-name"><strong>GitHub API</strong><span>api.github.com</span></div>
              <svg viewBox="0 0 72 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 15L8 14L16 15L24 13L32 14L40 11L48 13L56 10L64 12L72 9"/></svg>
              <div class="endpoint-state"><strong>126 ms</strong><span>正常</span></div>
            </article>
          </div>
        </section>

        <nav class="bottom-nav future-nav" aria-label="主导航">
          <a class="nav-item" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="m12 16 4-5"/><circle cx="12" cy="16" r="1.35" fill="currentColor" stroke="none"/></svg><span>测试</span></a>
          <a class="nav-item active" href="probe.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><path d="M5 18V9m5 9V5m5 13v-7m4 7V8"/><circle cx="5" cy="7" r="1.5"/><circle cx="10" cy="3" r="1.5"/><circle cx="15" cy="9" r="1.5"/><circle cx="19" cy="6" r="1.5"/></svg><span>探针</span></a>
          <a class="nav-item" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="m8 12 2.4 2.4L16 8.8"/></svg><span>结果</span></a>
          <a class="nav-item" href="map.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><path d="m4 6 5-2 6 2 5-2v14l-5 2-6-2-5 2Z"/><path d="M9 4v14m6-12v14"/></svg><span>地图</span></a>
          <a class="nav-item" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4m-8.6 8.6-1.4 1.4"/></svg><span>设置</span></a>
        </nav>
        <div id="future-toast" class="toast" role="status"></div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script src="future.js"></script>
</body>
</html>
