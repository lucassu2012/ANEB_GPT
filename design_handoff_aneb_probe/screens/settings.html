<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a18"><title>ANEB Probe · 设置</title><link rel="stylesheet" href="suite.css"></head>
<body><main class="suite-stage"><section class="suite-shell" aria-label="ANEB 设置手机界面"><div class="suite-app">
  <div class="suite-status"><span>14:40</span><span class="suite-icons"><span class="suite-signal"><i></i><i></i><i></i><i></i></span><span class="suite-wifi"></span><span class="suite-battery"></span></span></div>
  <a class="suite-wordmark" href="home.html" aria-label="返回首页"><svg viewBox="0 0 20 20" fill="none"><path d="M3.5 13.5a7 7 0 0 1 13 0" stroke="currentColor" stroke-width="1.45"/><path d="m10 13 3.7-5" stroke="currentColor" stroke-width="1.45"/><circle cx="10" cy="13" r="1" fill="currentColor"/></svg><strong>ANEB</strong><span>PROBE</span></a>
  <button class="suite-menu" type="button" data-toast="ANEB Probe · v0.2.2" aria-label="版本信息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg></button>
  <section class="suite-scroll">
    <header class="page-head"><span class="eyebrow">PREFERENCES</span><h1>设置</h1><p>测试行为、界面和数据偏好。</p></header>
    <div class="section-title"><span>测试</span></div><article class="suite-card settings-group">
      <div class="setting-row"><span class="setting-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></span><span class="setting-label"><strong>默认视图</strong><span>测试结束后的结果层级</span></span><span class="mode-segment"><button class="active" type="button" data-segment>简洁</button><button type="button" data-segment>专业</button></span></div>
      <a class="setting-row" href="server.html" style="text-decoration:none"><span class="setting-icon" style="--icon:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span><span class="setting-label"><strong>测试节点</strong><span>Node-SZ-03</span></span><span class="row-value">自动 <em>›</em></span></a>
      <div class="setting-row"><span class="setting-icon" style="--icon:var(--yellow)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5m0 14 6-4 4 3 6-5"/></svg></span><span class="setting-label"><strong>包含 REACH 探测</strong><span>检查 API 可达性</span></span><button class="switch on" type="button" role="switch" aria-checked="true" aria-label="包含 REACH 探测"></button></div>
    </article>
    <div class="section-title"><span>外观与反馈</span></div><article class="suite-card settings-group">
      <a class="setting-row" href="foundations.html" style="text-decoration:none"><span class="setting-icon" style="--icon:var(--violet)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="12" cy="16" r="3"/></svg></span><span class="setting-label"><strong>视觉基础</strong><span>颜色、排版与圆角</span></span><span class="row-value"><em>›</em></span></a>
      <a class="setting-row" href="motion.html" style="text-decoration:none"><span class="setting-icon" style="--icon:var(--cyan)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 16c4-10 12 2 16-8"/><path d="m16 6 4 2-2 4"/></svg></span><span class="setting-label"><strong>动效规范</strong><span>跟随系统减弱动效</span></span><span class="row-value"><em>›</em></span></a>
      <div class="setting-row"><span class="setting-icon" style="--icon:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span><span class="setting-label"><strong>完成提醒</strong><span>测试结束后轻触反馈</span></span><button class="switch on" type="button" role="switch" aria-checked="true" aria-label="测试完成提醒"></button></div>
    </article>
    <div class="section-title"><span>数据与隐私</span></div><article class="suite-card settings-group">
      <div class="setting-row"><span class="setting-icon" style="--icon:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><span class="setting-label"><strong>匿名上报数据</strong><span>帮助改善节点质量</span></span><button class="switch" type="button" role="switch" aria-checked="false" aria-label="匿名上报数据"></button></div>
      <button class="setting-row" type="button" data-toast="导出将在真实历史数据接入后开放"><span class="setting-icon" style="--icon:var(--muted)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg></span><span class="setting-label"><strong>导出记录</strong><span>JSON / CSV</span></span><span class="row-value"><em>›</em></span></button>
    </article>
  </section>
  <nav class="suite-nav" data-suite-nav data-active="settings"></nav><div id="suite-toast" class="suite-toast" role="status"></div><div class="suite-homebar"></div>
</div></section></main><script src="suite.js"></script></body></html>
