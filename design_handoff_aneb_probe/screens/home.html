<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a18">
  <meta name="color-scheme" content="dark">
  <title>ANEB Probe · AI 网络体验测试</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <main class="preview-stage">
    <section class="device-shell" aria-label="ANEB Probe 手机界面">
      <div id="app" class="app" data-state="idle">
        <div class="ambient" aria-hidden="true"></div>

        <div class="status-bar" aria-label="状态栏">
          <span>14:32</span>
          <span class="status-icons"><span class="signal" aria-label="信号良好"><i></i><i></i><i></i><i></i></span><span class="wifi" aria-hidden="true"></span><span class="battery" aria-label="电量 86%"><i></i></span></span>
        </div>

        <button class="close-button" type="button" data-action="cancel" aria-label="取消测试">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l16 16M20 4 4 20"/></svg>
        </button>

        <div class="wordmark" aria-label="ANEB Probe">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 13.5a7 7 0 0 1 13 0" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><path d="m10 13 3.7-5" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><circle cx="10" cy="13" r="1" fill="currentColor"/></svg>
          <strong>ANEB</strong><span>PROBE</span>
        </div>

        <section class="live-metrics" aria-label="测试中实时指标" aria-hidden="true">
          <div class="throughput-row">
            <div><span class="metric-direction down">↓</span><span>Token 流速</span><strong><b id="token-rate">—</b> /秒</strong></div>
            <div><span class="metric-direction up">↑</span><span>上行</span><strong><b id="upload-rate">—</b> Mbps</strong></div>
          </div>
          <div class="quality-row">
            <article>
              <div><span>Ping</span><strong><b id="ping-value">—</b> ms</strong></div>
              <svg viewBox="0 0 96 26" preserveAspectRatio="none" aria-hidden="true"><path class="spark-grid" d="M0 22H96"/><path id="ping-line" class="spark-line cyan" d="M0 19L96 19"/></svg>
            </article>
            <article>
              <div><span>抖动</span><strong><b id="jitter-value">—</b> ms</strong></div>
              <svg viewBox="0 0 96 26" preserveAspectRatio="none" aria-hidden="true"><path class="spark-grid" d="M0 22H96"/><path id="jitter-line" class="spark-line mint" d="M0 20L96 20"/></svg>
            </article>
            <article>
              <div><span>丢包</span><strong><b id="loss-value">—</b> %</strong></div>
              <svg viewBox="0 0 96 26" preserveAspectRatio="none" aria-hidden="true"><path class="spark-grid" d="M0 22H96"/><path id="loss-line" class="spark-line violet" d="M0 21L96 21"/></svg>
            </article>
          </div>
        </section>

        <section class="hero" aria-live="polite">
          <button id="test-ring" class="test-ring" type="button" data-action="start" aria-label="开始 AI 网络体验测试">
            <span class="ring-track" aria-hidden="true"></span>
            <span class="ring-stroke" aria-hidden="true"></span>
            <span class="ring-head" aria-hidden="true"></span>
            <svg class="gauge" viewBox="0 0 260 260" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <defs>
                <linearGradient id="gaugeGradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#37c9f2"/><stop offset=".55" stop-color="#54e4d1"/><stop offset="1" stop-color="#7aee8b"/></linearGradient>
                <linearGradient id="gaugeUpload" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b78ff"/><stop offset="1" stop-color="#d66ef1"/></linearGradient>
              </defs>
              <path class="gauge-track" pathLength="100" d="M55.75 204.25A105 105 0 1 1 204.25 204.25"/>
              <path id="gauge-progress" class="gauge-progress" pathLength="100" d="M55.75 204.25A105 105 0 1 1 204.25 204.25"/>
              <g class="gauge-ticks">
                <text x="43" y="218">0</text><text x="37" y="126">25</text><text x="130" y="31">50</text><text x="223" y="126">75</text><text x="217" y="218">100</text>
              </g>
              <g id="gauge-needle" class="gauge-needle"><path d="M130 130L124 135L130 51L136 135Z"/><circle cx="130" cy="130" r="5"/></g>
            </svg>
            <span class="ring-content idle-copy" data-copy="idle">开始</span>
            <span class="ring-content connecting-copy" data-copy="connecting">正在连接...</span>
            <span class="ring-content running-copy" data-copy="running"><strong id="live-score">0.00</strong><small id="live-phase">响应 Mbps</small></span>
            <span class="ring-content result-copy" data-copy="result"><strong>89</strong><small>优秀</small></span>
          </button>
          <p id="state-caption" class="state-caption">评估网络是否适合 AI 对话、编码和文件上传</p>
        </section>

        <section id="network-sheet" class="network-sheet" data-snap="collapsed" aria-label="当前测试配置">
          <div class="sheet-handle-zone" data-sheet-handle role="button" tabindex="0" aria-label="展开网络详情" aria-expanded="false">
            <span class="sheet-handle" aria-hidden="true"></span>
          </div>
          <button class="sheet-summary" type="button" data-action="toggle-sheet">
            <span class="detail-icon wifi-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"><path d="M5 10.5a11 11 0 0 1 14 0M8 14a6.5 6.5 0 0 1 8 0M11 17.5a2 2 0 0 1 2 0"/></svg>
            </span>
            <span><strong id="sheet-node-name">深圳 · 中国电信</strong><small>iPhone 15 Pro · 5G SA</small></span>
            <svg class="sheet-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="m6 12 4-4 4 4"/></svg>
          </button>
          <div class="sheet-details">
            <div class="detail-row">
              <span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"><path d="M4 8h16M4 12h10M4 16h7"/></svg></span>
              <div><span>连接模式</span><strong>5G SA · 多线程</strong></div>
            </div>
            <div class="detail-row">
              <span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.3 2.2 3.5 4.9 3.5 8S14.3 17.8 12 20M12 4c-2.3 2.2-3.5 4.9-3.5 8S9.7 17.8 12 20"/></svg></span>
              <div><span>测试节点</span><strong id="node-name">深圳 · 中国电信</strong><small id="node-meta">Node-SZ-03 · 12ms</small></div>
              <button class="change-node" type="button" data-action="open-node-modal">更换</button>
            </div>
            <div class="detail-row muted-row">
              <span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"><path d="M5 15a10 10 0 0 1 14 0M8 18a6 6 0 0 1 8 0M11 21a2 2 0 0 1 2 0"/></svg></span>
              <div><span>AI 工作负载</span><strong>对话 · 编码 · 文件上传</strong></div>
            </div>
          </div>
        </section>

        <section class="result-panel" aria-label="测试结果摘要">
          <p>你的网络<strong>很适合 AI 助手</strong></p>
          <div class="result-metrics">
            <div><span>首字响应</span><strong>0.42<small>秒</small></strong></div>
            <div><span>Token 流速</span><strong>142<small>/秒</small></strong></div>
            <div><span>卡顿</span><strong>0<small>次</small></strong></div>
          </div>
          <button class="retest-button" type="button" data-action="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2 5.3"/><path d="M20 5v6h-6"/></svg><span>重新测试</span></button>
        </section>

        <nav class="bottom-nav" aria-label="主导航">
          <button type="button" class="nav-item active" data-action="nav" data-target="测试">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="m12 16 4-5"/><circle cx="12" cy="16" r="1.35" fill="currentColor" stroke="none"/></svg><span>测试</span>
          </button>
          <a class="nav-item" href="probe.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><path d="M5 18V9m5 9V5m5 13v-7m4 7V8"/><circle cx="5" cy="7" r="1.5"/><circle cx="10" cy="3" r="1.5"/><circle cx="15" cy="9" r="1.5"/><circle cx="19" cy="6" r="1.5"/></svg><span>探针</span>
          </a>
          <a class="nav-item" href="history.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m8 12 2.4 2.4L16 8.8"/></svg><span>结果</span>
          </a>
          <a class="nav-item" href="map.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"><path d="m4 6 5-2 6 2 5-2v14l-5 2-6-2-5 2Z"/><path d="M9 4v14m6-12v14"/></svg><span>地图</span>
          </a>
          <a class="nav-item" href="settings.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.8-1.8.9-1.9L15 4l-1.9.9-1.8-.8-.7-2h-3l-.7 2-1.8.8L3.2 4 1.1 6.1 2 8l-.8 1.8-2 .7v3l2 .7.8 1.8-.9 1.9L3.2 20l1.9-.9 1.8.8.7 2h3l.7-2 1.8-.8 1.9.9 2.1-2.1-.9-1.9.8-1.8Z" transform="translate(2 -1) scale(.84)"/></svg><span>设置</span>
          </a>
        </nav>

        <div id="node-modal" class="modal-backdrop" aria-hidden="true">
          <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="node-modal-title">
            <div class="modal-icon" aria-hidden="true"><span></span><span></span><span></span></div>
            <h2 id="node-modal-title">选择测试节点</h2>
            <p>优先选择低延迟节点，结果会更接近你的真实 AI 使用体验。</p>
            <div class="node-options" role="listbox" aria-label="测试节点">
              <button type="button" data-node="0"><span><strong>深圳 · 中国电信</strong><small>Node-SZ-03</small></span><em>12 ms</em></button>
              <button type="button" data-node="1"><span><strong>广州 · 中国移动</strong><small>Node-GZ-06</small></span><em>16 ms</em></button>
              <button type="button" data-node="2"><span><strong>香港 · Cloud Edge</strong><small>Node-HK-02</small></span><em>28 ms</em></button>
            </div>
            <button class="modal-cancel" type="button" data-action="close-node-modal">取消</button>
          </section>
        </div>

        <div id="toast" class="toast" role="status"></div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script src="home.js"></script>
</body>
</html>
