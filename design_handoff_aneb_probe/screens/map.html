<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b1b">
  <meta name="color-scheme" content="dark">
  <title>ANEB Probe · 网络地图</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="future.css">
</head>
<body>
  <main class="preview-stage">
    <section class="device-shell" aria-label="ANEB 网络地图手机界面">
      <div id="future-app" class="app future-app map-app" data-layer="quality">
        <div class="status-bar map-status" aria-label="状态栏">
          <span>14:32</span>
          <span class="status-icons"><span class="signal" aria-label="信号良好"><i></i><i></i><i></i><i></i></span><span class="wifi" aria-hidden="true"></span><span class="battery" aria-label="电量 86%"><i></i></span></span>
        </div>
        <a class="wordmark" href="home.html" aria-label="返回 ANEB Probe 首页">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 13.5a7 7 0 0 1 13 0" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><path d="m10 13 3.7-5" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><circle cx="10" cy="13" r="1" fill="currentColor"/></svg><strong>ANEB</strong><span>PROBE</span>
        </a>
        <button class="menu-button" type="button" data-future-toast="地图数据源将在正式版接入" aria-label="更多设置"><i></i><i></i><i></i></button>

        <div class="map-title"><span>NETWORK MAP</span><strong>深圳 · 福田区</strong></div>
        <div class="map-controls" role="group" aria-label="地图图层">
          <button type="button" class="active" data-map-layer="quality">AI 体验</button>
          <button type="button" data-map-layer="latency">延迟</button>
        </div>
        <button class="locate-button" type="button" data-future-toast="已定位到当前位置" aria-label="定位当前位置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>

        <section class="map-canvas" aria-label="深圳 AI 网络体验热力地图">
          <svg class="city-map" viewBox="0 0 390 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs>
              <pattern id="mapGrid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#27304b" stroke-width=".65"/></pattern>
              <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1530"/><stop offset="1" stop-color="#071024"/></linearGradient>
              <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
            </defs>
            <rect width="390" height="720" fill="#0a0e1c"/>
            <rect width="390" height="720" fill="url(#mapGrid)" opacity=".62"/>
            <path d="M-20 510C82 450 126 528 203 503C272 480 314 421 420 446V760H-20Z" fill="url(#water)"/>
            <g class="heat heat-quality" opacity=".8">
              <circle cx="102" cy="210" r="78" fill="#45e1d0" opacity=".12" filter="url(#soft)"/>
              <circle cx="268" cy="300" r="96" fill="#5edb8e" opacity=".14" filter="url(#soft)"/>
              <circle cx="192" cy="438" r="90" fill="#52d7ed" opacity=".15" filter="url(#soft)"/>
              <circle cx="328" cy="486" r="58" fill="#c574ef" opacity=".15" filter="url(#soft)"/>
            </g>
            <g class="heat heat-latency" opacity="0">
              <circle cx="102" cy="210" r="78" fill="#7c82ff" opacity=".19" filter="url(#soft)"/>
              <circle cx="268" cy="300" r="96" fill="#42c5f4" opacity=".16" filter="url(#soft)"/>
              <circle cx="192" cy="438" r="90" fill="#f2b15a" opacity=".2" filter="url(#soft)"/>
              <circle cx="328" cy="486" r="58" fill="#ee6b8b" opacity=".18" filter="url(#soft)"/>
            </g>
            <g class="blocks" fill="#11182c" stroke="#222c46" stroke-width="1">
              <path d="M18 110h62v54H18zM91 97h48v66H91zM151 111h72v45h-72zM239 92h57v69h-57zM312 106h61v58h-61z"/>
              <path d="M9 181h85v67H9zM109 179h55v55h-55zM181 170h79v71h-79zM276 181h42v60h-42zM330 176h68v77h-68z"/>
              <path d="M20 267h55v78H20zM90 262h91v50H90zM199 260h62v76h-62zM278 266h94v61h-94z"/>
              <path d="M7 365h82v58H7zM105 343h57v82h-57zM178 354h78v55h-78zM274 347h46v74h-46zM334 353h65v64h-65z"/>
              <path d="M16 438h61v46H16zM93 443h78v55H93zM223 431h46v59h-46zM285 435h89v48h-89z"/>
            </g>
            <g class="coverage-cells" opacity=".78">
              <rect x="19" y="111" width="60" height="52" rx="4" fill="#3cd2b5" opacity=".2"/><rect x="92" y="98" width="46" height="64" rx="4" fill="#38bfe8" opacity=".19"/>
              <rect x="182" y="171" width="77" height="69" rx="4" fill="#5be397" opacity=".22"/><rect x="277" y="182" width="40" height="58" rx="4" fill="#61e2ba" opacity=".24"/>
              <rect x="91" y="263" width="89" height="48" rx="4" fill="#44d7e7" opacity=".23"/><rect x="200" y="261" width="60" height="74" rx="4" fill="#6ce292" opacity=".23"/>
              <rect x="106" y="344" width="55" height="80" rx="4" fill="#38cfe8" opacity=".21"/><rect x="179" y="355" width="76" height="53" rx="4" fill="#50e0a6" opacity=".25"/>
              <rect x="286" y="436" width="87" height="46" rx="4" fill="#b663dd" opacity=".26"/>
            </g>
            <g class="roads" fill="none" stroke-linecap="round">
              <path d="M-10 258C76 245 148 267 218 250S338 215 410 228" stroke="#46516d" stroke-width="8"/><path d="M-10 258C76 245 148 267 218 250S338 215 410 228" stroke="#11182c" stroke-width="5"/>
              <path d="M76 60C84 147 89 224 99 310S121 465 136 560" stroke="#46516d" stroke-width="8"/><path d="M76 60C84 147 89 224 99 310S121 465 136 560" stroke="#11182c" stroke-width="5"/>
              <path d="M258 58C252 158 266 235 254 320S229 450 236 566" stroke="#46516d" stroke-width="8"/><path d="M258 58C252 158 266 235 254 320S229 450 236 566" stroke="#11182c" stroke-width="5"/>
              <path d="M-8 426C89 415 167 432 238 414S334 379 405 390" stroke="#3d4964" stroke-width="6"/><path d="M-8 426C89 415 167 432 238 414S334 379 405 390" stroke="#11182c" stroke-width="3"/>
            </g>
            <g class="map-labels" fill="#8993aa" font-family="system-ui" font-size="8">
              <text x="27" y="205">香蜜湖</text><text x="187" y="195">福田中心区</text><text x="289" y="292">皇岗</text><text x="42" y="390">车公庙</text><text x="196" y="462">福田口岸</text><text x="290" y="530">深圳河</text>
            </g>
          </svg>
          <div class="map-marker main-marker" style="--x:51%;--y:47%"><i></i><span>当前位置<strong>优秀 · 18 ms</strong></span></div>
          <div class="map-dot good" style="--x:25%;--y:31%"><i></i><span>92</span></div>
          <div class="map-dot good" style="--x:72%;--y:38%"><i></i><span>87</span></div>
          <div class="map-dot warning" style="--x:84%;--y:62%"><i></i><span>68</span></div>
        </section>

        <section id="map-sheet" class="map-sheet" aria-label="当前位置网络信息">
          <button class="map-sheet-handle" type="button" data-map-sheet aria-label="展开地图详情"><span></span></button>
          <div class="map-network-summary">
            <span class="detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45"><path d="M5 10.5a11 11 0 0 1 14 0M8 14a6.5 6.5 0 0 1 8 0M11 17.5a2 2 0 0 1 2 0"/></svg></span>
            <div><strong>中国电信 5G</strong><span>深圳 · 福田区 · AI 体验优秀</span></div>
            <em>89</em>
          </div>
          <div class="map-sheet-details">
            <div><span class="legend-dot excellent"></span><strong>优秀</strong><small>80–100</small></div>
            <div><span class="legend-dot fair"></span><strong>一般</strong><small>60–79</small></div>
            <div><span class="legend-dot poor"></span><strong>需改善</strong><small>0–59</small></div>
          </div>
        </section>

        <nav class="bottom-nav future-nav map-nav" aria-label="主导航">
          <a class="nav-item" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M4 16a8 8 0 0 1 16 0"/><path d="m12 16 4-5"/><circle cx="12" cy="16" r="1.35" fill="currentColor" stroke="none"/></svg><span>测试</span></a>
          <a class="nav-item" href="probe.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><path d="M5 18V9m5 9V5m5 13v-7m4 7V8"/><circle cx="5" cy="7" r="1.5"/><circle cx="10" cy="3" r="1.5"/><circle cx="15" cy="9" r="1.5"/><circle cx="19" cy="6" r="1.5"/></svg><span>探针</span></a>
          <a class="nav-item" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="m8 12 2.4 2.4L16 8.8"/></svg><span>结果</span></a>
          <a class="nav-item active" href="map.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><path d="m4 6 5-2 6 2 5-2v14l-5 2-6-2-5 2Z"/><path d="M9 4v14m6-12v14"/></svg><span>地图</span></a>
          <a class="nav-item" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4m-8.6 8.6-1.4 1.4"/></svg><span>设置</span></a>
        </nav>
        <div id="future-toast" class="toast" role="status"></div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script src="future.js"></script>
</body>
</html>
