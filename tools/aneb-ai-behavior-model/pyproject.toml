[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "aneb-ai-behavior-model"
version = "0.3.3"
description = "Deterministic AI workload behavior modeling and ANEB Profile generation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.22,<5"]

[project.scripts]
aneb-behavior = "aneb_behavior_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
